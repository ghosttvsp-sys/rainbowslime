name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 4.9
          cache-disabled: true
      - run: |
          unzip -q rainbowslime-projeto-completo.zip
          cd rainbowslime
          gradle --no-daemon setupDecompWorkspace build
      - uses: actions/upload-artifact@v4
        with:
          name: rainbowslime-jar
          path: rainbowslime/build/libs/*.jar
